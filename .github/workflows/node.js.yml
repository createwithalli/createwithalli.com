# Static site CI — validates structure and runs npm steps only when package.json exists
name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      if: hashFiles('package.json') != ''
      run: npm ci

    - name: Build
      if: hashFiles('package.json') != ''
      run: npm run build --if-present

    - name: Test
      if: hashFiles('package.json') != ''
      run: npm test --if-present

    - name: Validate static site
      run: |
        echo "Validating static site structure..."
        test -f index.html  && echo "✓ index.html"  || { echo "✗ index.html missing";  exit 1; }
        test -f style.css   && echo "✓ style.css"   || { echo "✗ style.css missing";   exit 1; }
        test -f app.js      && echo "✓ app.js"      || { echo "✗ app.js missing";      exit 1; }
        echo "Static site validation passed."
